name: Profile visuals

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/settings/3d-contrib.json

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide=issues&hide_rank=true&bg_color=0b0c10&title_color=f0c765&icon_color=f0c765&text_color=ddd7cb&border_color=2a2f38&ring_color=f0c765&border_radius=14
          path: cards/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=css,scss,html&bg_color=0b0c10&title_color=f0c765&icon_color=f0c765&text_color=ddd7cb&border_color=2a2f38&ring_color=f0c765&border_radius=14
          path: cards/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}







      - name: Commit generated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib cards
          git diff --cached --quiet || git commit -m "chore: update profile visuals"
          git pull --rebase
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#f0c765&color_dots=#171a20,#5a4320,#8f6a26,#c9922f,#f0c765
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
